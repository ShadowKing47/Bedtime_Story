<!DOCTYPE html>
<html class="dark" lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Dream Weaver - Bedtime Storyteller</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com" rel="preconnect"/>
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
    <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@100..900&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <style>
        .material-symbols-outlined {
            font-variation-settings:
            'FILL' 1,
            'wght' 400,
            'GRAD' 0,
            'opsz' 24
        }
        
        /* Custom scrollbar */
        .conversation-area::-webkit-scrollbar {
            width: 8px;
        }
        
        .conversation-area::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.05);
        }
        
        .conversation-area::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 4px;
        }
        
        .conversation-area::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.3);
        }
    </style>
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#144bb8",
                        "background-light": "#f6f6f8",
                        "background-dark": "#111621",
                    },
                    fontFamily: {
                        "display": ["Lexend", "sans-serif"]
                    },
                    borderRadius: {"DEFAULT": "0.5rem", "lg": "1rem", "xl": "1.5rem", "full": "9999px"},
                },
            },
        }
    </script>
</head>
<body class="font-display bg-background-light dark:bg-background-dark">
<div class="relative flex h-screen w-full flex-col overflow-hidden">
    <div class="flex h-full flex-row">
        <!-- SideNavBar -->
        <aside class="flex h-full w-72 shrink-0 flex-col justify-between bg-white/5 p-4 border-r border-white/10">
            <div class="flex flex-col gap-4">
                <div class="flex items-center gap-3 p-2">
                    <div class="bg-center bg-no-repeat aspect-square bg-cover rounded-full size-10" data-alt="Dream Weaver application logo" style='background-image: url("https://lh3.googleusercontent.com/aida-public/AB6AXuAX0BNLG--aL1d_hgDTyCDUpLRVp4AW63JLM6_A8DAaI3Zc9txbTpaGDdvRRAub-Ls3AcdwIzFq38TObWgDOrdtS9-mE9MDQImcDJjuADXT4X3RohkL55_Z-MbBieIsdwQC447iQ2WiLl6Uy9nezghZk-KX3igo3nORXjlvitKFpMJVFkTxjPWtaF8mhaTqxOFzM2pHxO9mPZwdTzXZv9AIp70GI5OT8u-9vTXl8XLhjW_HejPNQeN1bjLbwg8NNeiusSHDRZcITXAG");'></div>
                    <div class="flex flex-col">
                        <h1 class="text-white text-base font-medium leading-normal">Dream Weaver</h1>
                        <p class="text-gray-400 text-sm font-normal leading-normal">Your bedtime storyteller</p>
                    </div>
                </div>
                <div class="flex flex-col gap-1 mt-4">
                    <a class="flex items-center gap-3 px-3 py-2 rounded-lg bg-primary/20 text-white hover:bg-primary/30 transition-colors" href="#">
                        <span class="material-symbols-outlined text-xl">history</span>
                        <p class="text-sm font-medium leading-normal">Story History</p>
                    </a>
                    <a class="flex items-center gap-3 px-3 py-2 rounded-lg text-gray-300 hover:bg-white/10 hover:text-white transition-colors" href="#">
                        <span class="material-symbols-outlined text-xl" style="font-variation-settings: 'FILL' 0;">settings</span>
                        <p class="text-sm font-medium leading-normal">Settings</p>
                    </a>
                </div>
            </div>
            <button onclick="newStory()" class="flex min-w-[84px] max-w-[480px] cursor-pointer items-center justify-center overflow-hidden rounded-lg h-10 px-4 bg-primary text-white text-sm font-bold leading-normal tracking-[0.015em] hover:bg-primary/90 transition-colors">
                <span class="truncate">New Story</span>
            </button>
        </aside>
        
        <!-- Main Chat Area -->
        <main class="flex flex-1 flex-col bg-background-dark">
            <!-- Header -->
            <header class="flex h-16 shrink-0 items-center border-b border-white/10 px-6">
                <h1 class="text-white tracking-light text-xl font-bold leading-tight" id="chatTitle">Dream Weaver</h1>
            </header>
            
            <!-- Conversation Area -->
            <div class="flex-1 overflow-y-auto p-6 conversation-area" id="conversationArea">
                <div class="flex flex-col gap-6" id="messagesContainer">
                    <!-- Welcome Message -->
                    <div class="flex items-end gap-3">
                        <div class="bg-center bg-no-repeat aspect-square bg-cover rounded-full w-10 shrink-0" data-alt="Dream Weaver avatar" style='background-image: url("https://lh3.googleusercontent.com/aida-public/AB6AXuCEDKRHUD4WkO47o4VTRjcNCSU4aqDzfPVUlJiqPXtVOSulRSNrWYRAWS-f8nYEO9awzKGU2Cx23xVsp8ethfyzOz_agDbcCBlRrfcKT_1A_5d6EZvP44VwDX-DPwulInrYu-LoTL2RJzlo5wgmrJE6u_x24y5-xSjs6UyER4pxP7hUWxwa0OeNxERVDkisA4JSD-2M59YBftWfmfFj8vdkUH_hfHIgyX8ksj6OzI79ACIJdSiNRmlcpIQdm_IcCUmZgbkSmlko5ZmE");'></div>
                        <div class="flex flex-1 flex-col gap-1.5 items-start">
                            <p class="text-gray-400 text-[13px] font-medium leading-normal max-w-lg">Dream Weaver</p>
                            <div class="text-base font-normal leading-relaxed flex max-w-lg rounded-xl rounded-bl-none px-4 py-3 bg-white/5 text-gray-200">
                                Good evening! What kind of story shall we dream up tonight?
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            
            <!-- Message Input Field -->
            <div class="shrink-0 p-6 pt-2">
                <div class="relative flex items-center">
                    <input 
                        id="messageInput"
                        class="w-full rounded-lg bg-white/5 h-12 text-white placeholder:text-gray-500 border-none pl-4 pr-12 focus:ring-2 focus:ring-primary/50 transition-shadow" 
                        placeholder="Tell me a story about..." 
                        type="text"
                        onkeypress="handleKeyPress(event)"
                    />
                    <button onclick="sendMessage()" class="absolute right-3 flex h-8 w-8 items-center justify-center rounded-md bg-primary text-white hover:bg-primary/90 transition-colors">
                        <span class="material-symbols-outlined text-xl">send</span>
                    </button>
                </div>
            </div>
        </main>
    </div>
</div>

<script>
    // Avatar URLs
    const dreamWeaverAvatar = 'https://lh3.googleusercontent.com/aida-public/AB6AXuCEDKRHUD4WkO47o4VTRjcNCSU4aqDzfPVUlJiqPXtVOSulRSNrWYRAWS-f8nYEO9awzKGU2Cx23xVsp8ethfyzOz_agDbcCBlRrfcKT_1A_5d6EZvP44VwDX-DPwulInrYu-LoTL2RJzlo5wgmrJE6u_x24y5-xSjs6UyER4pxP7hUWxwa0OeNxERVDkisA4JSD-2M59YBftWfmfFj8vdkUH_hfHIgyX8ksj6OzI79ACIJdSiNRmlcpIQdm_IcCUmZgbkSmlko5ZmE';
    const userAvatar = 'https://lh3.googleusercontent.com/aida-public/AB6AXuDu-VwqQxq1P7XvBh5sE0S6CYyxUUlMLgiyYo3Mhu53tHy6eo-Ve78doU4u1GliqSzRfJLzmXA5WaHSg8TYSngxufXkeycBnVDEUBDWM9A6t8ERRJXRIWljMU1XL0kzkYxPXBcGMgvvlBCEBFbCiZdTYjUeqZo7j8aODQavzOMXU-q-rZzXvvOdmx5DtNBsHrIUZazYHkIzb6owNHkqlrHnrS05-NPnXyfBd4w28HyE1kfpabco-nLQ6l5Qourk2XcDg995hkykfOHm';

    // Add user message to chat
    function addUserMessage(text) {
        const messagesContainer = document.getElementById('messagesContainer');
        const messageDiv = document.createElement('div');
        messageDiv.className = 'flex items-end gap-3 justify-end';
        messageDiv.innerHTML = `
            <div class="flex flex-1 flex-col gap-1.5 items-end">
                <p class="text-gray-400 text-[13px] font-medium leading-normal max-w-lg text-right">You</p>
                <div class="text-base font-normal leading-relaxed flex max-w-lg rounded-xl rounded-br-none px-4 py-3 bg-primary text-white">
                    ${escapeHtml(text)}
                </div>
            </div>
            <div class="bg-center bg-no-repeat aspect-square bg-cover rounded-full w-10 shrink-0" data-alt="User avatar" style='background-image: url("${userAvatar}");'></div>
        `;
        messagesContainer.appendChild(messageDiv);
        scrollToBottom();
    }

    // Add AI message to chat
    function addAIMessage(text, isLoading = false) {
        const messagesContainer = document.getElementById('messagesContainer');
        const messageDiv = document.createElement('div');
        messageDiv.className = 'flex items-end gap-3';
        
        if (isLoading) {
            messageDiv.id = 'loadingMessage';
            messageDiv.innerHTML = `
                <div class="bg-center bg-no-repeat aspect-square bg-cover rounded-full w-10 shrink-0" data-alt="Dream Weaver avatar" style='background-image: url("${dreamWeaverAvatar}");'></div>
                <div class="flex flex-1 flex-col gap-1.5 items-start">
                    <p class="text-gray-400 text-[13px] font-medium leading-normal max-w-lg">Dream Weaver</p>
                    <div class="text-base font-normal leading-relaxed flex max-w-lg rounded-xl rounded-bl-none px-4 py-3 bg-white/5 text-gray-200">
                        <div class="flex items-center gap-2">
                            <div class="animate-pulse">✨</div>
                            <span>Weaving your magical story...</span>
                        </div>
                    </div>
                </div>
            `;
        } else {
            messageDiv.innerHTML = `
                <div class="bg-center bg-no-repeat aspect-square bg-cover rounded-full w-10 shrink-0" data-alt="Dream Weaver avatar" style='background-image: url("${dreamWeaverAvatar}");'></div>
                <div class="flex flex-1 flex-col gap-1.5 items-start">
                    <p class="text-gray-400 text-[13px] font-medium leading-normal max-w-lg">Dream Weaver</p>
                    <div class="text-base font-normal leading-relaxed flex max-w-3xl flex-col gap-3 rounded-xl rounded-bl-none px-4 py-3 bg-white/5 text-gray-200">
                        ${formatStoryText(text)}
                    </div>
                </div>
            `;
        }
        
        messagesContainer.appendChild(messageDiv);
        scrollToBottom();
        return messageDiv;
    }

    // Format story text into paragraphs
    function formatStoryText(text) {
        const paragraphs = text.split('\n').filter(p => p.trim());
        return paragraphs.map(p => `<p>${escapeHtml(p)}</p>`).join('');
    }

    // Escape HTML to prevent XSS
    function escapeHtml(text) {
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }

    // Scroll to bottom of conversation
    function scrollToBottom() {
        const conversationArea = document.getElementById('conversationArea');
        setTimeout(() => {
            conversationArea.scrollTop = conversationArea.scrollHeight;
        }, 100);
    }

    // Handle Enter key press
    function handleKeyPress(event) {
        if (event.key === 'Enter') {
            sendMessage();
        }
    }

    // Send message and generate story
    async function sendMessage() {
        const input = document.getElementById('messageInput');
        const text = input.value.trim();
        
        if (!text) {
            return;
        }

        // Add user message
        addUserMessage(text);
        
        // Clear input
        input.value = '';
        
        // Show loading message
        const loadingMsg = addAIMessage('', true);
        
        try {
            // Call API
            const response = await fetch('http://localhost:8000/generate', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({ text: text })
            });

            if (!response.ok) {
                throw new Error(`HTTP error! status: ${response.status}`);
            }

            const data = await response.json();
            
            // Remove loading message
            loadingMsg.remove();
            
            // Add story response
            addAIMessage(data.story);
            
            // Update chat title with first few words of request
            const titleWords = text.split(' ').slice(0, 5).join(' ');
            document.getElementById('chatTitle').textContent = titleWords + (text.split(' ').length > 5 ? '...' : '');
            
        } catch (error) {
            console.error('Error generating story:', error);
            
            // Remove loading message
            loadingMsg.remove();
            
            // Show error message
            addAIMessage('Oops! The story fairy is taking a little nap. Please make sure the backend server is running and try again! 🧚‍♀️');
        }
    }

    // New story function
    function newStory() {
        const messagesContainer = document.getElementById('messagesContainer');
        messagesContainer.innerHTML = `
            <div class="flex items-end gap-3">
                <div class="bg-center bg-no-repeat aspect-square bg-cover rounded-full w-10 shrink-0" data-alt="Dream Weaver avatar" style='background-image: url("${dreamWeaverAvatar}");'></div>
                <div class="flex flex-1 flex-col gap-1.5 items-start">
                    <p class="text-gray-400 text-[13px] font-medium leading-normal max-w-lg">Dream Weaver</p>
                    <div class="text-base font-normal leading-relaxed flex max-w-lg rounded-xl rounded-bl-none px-4 py-3 bg-white/5 text-gray-200">
                        Good evening! What kind of story shall we dream up tonight?
                    </div>
                </div>
            </div>
        `;
        document.getElementById('chatTitle').textContent = 'Dream Weaver';
        document.getElementById('messageInput').focus();
    }
</script>
</body>
</html>
